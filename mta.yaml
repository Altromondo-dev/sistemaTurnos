_schema-version: "3.2"
ID: sistemaTurnos
version: 0.0.2
modules:
- name: sistemaTurnos-destination-content
  type: com.sap.application.content
  requires:
  - name: sistemaTurnos-destination-service
    parameters:
      content-target: true
  - name: sistemaTurnos_html_repo_host
    parameters:
      service-key:
        name: sistemaTurnos_html_repo_host-key
  - name: uaa_sistemaTurnos
    parameters:
      service-key:
        name: uaa_sistemaTurnos-key
  parameters:
    content:
      instance:
        destinations:
        - Name: sistemaTurnos_sistemaTurnos_html_repo_host
          ServiceInstanceName: transenersistemadeturnos-html5-srv
          ServiceKeyName: sistemaTurnos_html_repo_host-key
          sap.cloud.service: sistemaTurnos
        - Authentication: OAuth2UserTokenExchange
          Name: sistemaTurnos_uaa_sistemaTurnos
          ServiceInstanceName: transenersistemadeturnos-xsuaa-srv
          ServiceKeyName: uaa_sistemaTurnos-key
          sap.cloud.service: sistemaTurnos
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: sistemaTurnos-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: sistemaTurnos_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - transenersistemadeturnos.zip
      name: transenersistemadeturnos
      target-path: resources/
- name: transenersistemadeturnos
  type: html5
  path: sistemadeturnos
  requires:
  - name: sap_processautomation
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: sap_processautomation
  type: org.cloudfoundry.managed-service
  parameters:
    service: process-automation-service
    service-plan: standard
- name: sistemaTurnos-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: transenersistemadeturnos-destination-service
    service-plan: lite
- name: sistemaTurnos_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: transenersistemadeturnos-html5-srv
    service-plan: app-host
- name: uaa_sistemaTurnos
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: transenersistemadeturnos-xsuaa-srv
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
